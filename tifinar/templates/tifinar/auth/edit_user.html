{% load static %}
{% include "tifinar/adm_header.html" %}
    <div class="content container">
            <h2>تعديل بيانات المستخدم</h2>
            <form method="POST" action="" enctype="multipart/form-data">
                {% csrf_token %}
            
                <div class="mb-3">
                    <!-- تحسين جزء الصورة -->
                <div class="mb-3">
                    <label for="profile_image" class="form-label">الصورة الشخصية</label>
                    {% if user.path %}
                        <img src="/static/tifinar/{{ user.path }}" class="img-thumbnail mb-2" width="100" alt="الصورة الحالية">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="clear_image" id="clear_image">
                            <label class="form-check-label" for="clear_image">حذف الصورة الحالية</label>
                        </div>
                    {% else %}
                        <p class="text-muted">لا توجد صورة حالياً</p>
                    {% endif %}
                    <input type="file" name="profile_image" accept="image/*" id="profile_image" class="form-control"  multiple onchange="previewImage(event)">
                </div>


                    <div id="imagePreview" class="mt-3"></div>
                    <script>
                    document.querySelector('form').addEventListener('submit', function(e) {
                        const password = document.getElementById('password').value;
                        const confirm = document.getElementById('password_confirmation').value;
                        
                        if (password && password !== confirm) {
                            e.preventDefault();
                            alert('كلمة المرور وتأكيدها غير متطابقين');
                        }
                    });

                        function previewImage(event) {
                            var reader = new FileReader();
                            reader.onload = function() {
                                var output = document.createElement('img');
                                output.src = reader.result;
                                output.width = 100;
                                var preview = document.getElementById('imagePreview');
                                preview.innerHTML = '';
                                preview.appendChild(output);

                                var currentImage = document.getElementById('currentImage');
                                if (currentImage) {
                                    currentImage.style.display = 'none';
                                }
                            };
                            reader.readAsDataURL(event.target.files[0]);
                        }
                    </script>
                    

                <hr>

                <div class="mb-3">
                        <label for="educational_level" class="form-label">
                            <i class="fas fa-graduation-cap"></i> هل يجب أن يكون للقارئ مستوى دراسي محدد لقراءة هذا المقال؟
                        </label>
                    
                    <select id="educational_level" name="educational_level" class="form-select">
                        <option value="Unknown" {% if form.educational_level.value == 'Unknown' or user.educational_level == 'Unknown' %}selected{% endif %}>لا، المقال مناسب للجميع</option>
                        <optgroup label="الإبتدائي :">
                            <option value="1st Year of Primary School" {% if form.educational_level.value == '1st Year of Primary School' or user.educational_level == '1st Year of Primary School' %}selected{% endif %}>السنة الأولى ابتدائي</option>
                            <option value="2nd Year of Primary School" {% if form.educational_level.value == '2nd Year of Primary School' or user.educational_level == '2nd Year of Primary School' %}selected{% endif %}>السنة الثانية ابتدائي</option>
                            <option value="3rd Year of Primary School" {% if form.educational_level.value == '3rd Year of Primary School' or user.educational_level == '3rd Year of Primary School' %}selected{% endif %}>السنة الثالثة ابتدائي</option>
                            <option value="4th Year of Primary School" {% if form.educational_level.value == '4th Year of Primary School' or user.educational_level == '4th Year of Primary School' %}selected{% endif %}>السنة الرابعة ابتدائي</option>
                            <option value="5th Year of Primary School" {% if form.educational_level.value == '5th Year of Primary School' or user.educational_level == '5th Year of Primary School' %}selected{% endif %}>السنة الخامسة ابتدائي</option>
                            <option value="6th Year of Primary School" {% if form.educational_level.value == '6th Year of Primary School' or user.educational_level == '6th Year of Primary School' %}selected{% endif %}>السنة السادسة ابتدائي</option>
                        </optgroup>
                        <optgroup label="الثانوي الإعدادي :">
                            <option value="1st Year of Middle School" {% if form.educational_level.value == '1st Year of Middle School' or user.educational_level == '1st Year of Middle School' %}selected{% endif %}>السنة الأولى إعدادي</option>
                            <option value="2nd Year of Middle School" {% if form.educational_level.value == '2nd Year of Middle School' or user.educational_level == '2nd Year of Middle School' %}selected{% endif %}>السنة الثانية إعدادي</option>
                            <option value="3rd Year of Middle School" {% if form.educational_level.value == '3rd Year of Middle School' or user.educational_level == '3rd Year of Middle School' %}selected{% endif %}>السنة الثالثة إعدادي</option>
                        </optgroup>
                        <optgroup label="الثانوي الثأهيلي :">
                            <option value="Common Core" {% if form.educational_level.value == 'Common Core' or user.educational_level == 'Common Core' %}selected{% endif %}>المشترك العلمي</option>
                            <option value="1st Year of Baccalaureate" {% if form.educational_level.value == '1st Year of Baccalaureate' or user.educational_level == '1st Year of Baccalaureate' %}selected{% endif %}>السنة الأولى من البكالوريا (تخصص علوم تجريبية)</option>
                            <option value="2nd Year of Baccalaureate" {% if form.educational_level.value == '2nd Year of Baccalaureate' or user.educational_level == '2nd Year of Baccalaureate' %}selected{% endif %}>السنة الثانية من البكالوريا (تخصص علوم فيزيائية)</option>
                        </optgroup>
                        <optgroup label="التعليم العالي">
                            <option value="Post-Baccalaureate" {% if form.educational_level.value == 'Post-Baccalaureate' or user.educational_level == 'Post-Baccalaureate' %}selected{% endif %}>الدراسة بعد البكالوريا</option>
                        </optgroup>
                    </select>
                </div>

                <hr>

                <div class="mb-3">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" name="email" id="email" class="form-control"
                        value="{{ user.email }}" >
                </div>

                <hr>
                
                <div class="mb-3">
                    <label for="password" class="form-label">كلمة المرور الجديدة (اختياري)</label>
                    <input type="password" name="password" id="password" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="password_confirmation" class="form-label">تأكيد كلمة المرور الجديدة</label>
                    <input type="password" name="password_confirmation" id="password_confirmation" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
            </form>
        </div>

{% include "tifinar/adm_footer.html" %}
