
{% load static %}
{% include "tifinar/adm_header.html" %}
 <style>
        .chart-container {
            margin: 20px auto;
            text-align: center;
            cursor: zoom-in;
            max-width: 100%;
            overflow: hidden;
        }
        .chart-img {
            width: 100%;
            transition: transform 0.3s;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .chart-img.zoomed {
            transform: scale(1.8);
            cursor: zoom-out;
            z-index: 1000;
            position: relative;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .chart-title {
            font-size: 24px;
            margin: 15px 0;
            font-weight: bold;
        }
    </style>
<div class="content">
    <h2 class="mt-5">لوحة تحكم الزوار</h2>

    <div class="row">
        <div class="col-12 col-md-6 mt-4">
            <h4>إحصائيات الزيارات حسب عنوان IP</h4>
            <div class="form">
                <h4>عدد الزيارات لكل IP</h4>
                <img onclick="toggleZoom(this)" src="data:image/png;base64,{{ ip_chart }}" alt="الزيارات حسب IP" style="width: 100%; height: auto;" class="chart-img">
            </div>
        </div>

        <div class="col-12 col-md-6 mt-4">
            <h4>عدد الزيارات حسب نوع الجهاز</h4>
            <div class="form">
                <img onclick="toggleZoom(this)" src="data:image/png;base64,{{ device_chart }}" alt="الزيارات حسب نوع الجهاز" style="width: 100%; height: auto;" class="chart-img">
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12 col-md-6">
            <h4>عدد الزيارات لكل صفحة</h4>
            <div class="form">
                <img onclick="toggleZoom(this)" src="data:image/png;base64,{{ page_chart }}" alt="الزيارات حسب الصفحة" style="width: 100%; height: auto;" class="chart-img">
            </div>
        </div>

        <div class="col-12 col-md-6">
            <h4>عدد الزيارات حسب التاريخ (آخر 7 أيام)</h4>
            <div class="form">
                <img onclick="toggleZoom(this)" src="data:image/png;base64,{{ daily_chart }}" alt="الزيارات اليومية" style="width: 100%; height: auto;" class="chart-img">
            </div>
        </div>
    </div>
</div>
    <script>
        function toggleZoom(img) {
            img.classList.toggle('zoomed');
            
            if (img.classList.contains('zoomed')) {
                // عند التكبير، نحرك الصورة إلى منتصف الشاشة
                img.scrollIntoView({behavior: 'smooth', block: 'center'});
            }
        }
        
        // إغلاق التكبير عند النقر خارج الصورة
        document.addEventListener('click', function(e) {
            if (!e.target.classList.contains('chart-img')) {
                document.querySelectorAll('.chart-img.zoomed').forEach(img => {
                    img.classList.remove('zoomed');
                });
            }
        });
    </script>
{% include "tifinar/adm_footer.html" %}
