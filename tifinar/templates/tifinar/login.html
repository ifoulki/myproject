{% load static %}
{% load crispy_forms_tags %} {# إذا استعملت crispy-forms #}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="{% static 'bootstrap-5.3.7-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'icons-1.13.1/font/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'tifinar/css/style-mobile.css' %}">
    <link rel="stylesheet" href="{% static 'tifinar/css/main.css' %}">

    <link rel="icon" href="{% static 'tifinar/assets/siteicon.ico' %}">
    <title>تسجيل الدخول | مجلة تيفيناغ</title>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center bg-primary">
                        <h2 class="text-white"><i class="fas fa-user-plus"></i> تسجيل الدخول:</h2>
                    </div>
                    <div class="card-body">
                        
                        {% if messages %}
                        <div class="alert alert-danger">
                            <ul>
                                {% for message in messages %}
                                    <li><i class="fas fa-times-circle"></i> {{ message }}</li>
                                {% endfor %}
                            </ul>
                        </div>
                        {% endif %}

                        <form method="post" action="{% url 'login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                                <input type="text" name="email" class="form-control" placeholder="أدخل بريدك الإلكتروني ..." required>
                            </div>
                            
                            <div class="mb-3 position-relative">
                                <label class="form-label"><i class="fas fa-lock"></i> كلمة المرور</label>
                                <input type="password" name="password" id="password" class="form-control" placeholder="أدخل كلمة المرور ..." required>
                                <span class="eye-icon position-absolute top-50 end-0 translate-middle-y pe-2" onclick="togglePassword()">
                                    <i id="eye-icon" class="fas fa-eye"></i>
                                </span>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success"><i class="fas fa-user-check"></i> تسجيل الدخول</button>
                            </div>
                        </form>

                    </div>
                    <div class="card-footer text-center">
                        <small>ليس لديك حساب؟ <a href="" class="text-primary"><i class="fas fa-sign-in-alt"></i> إنشاء حساب جديد</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eye-icon");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>
</body>
</html>
